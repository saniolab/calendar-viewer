name: Publish image

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify package is public
        run: |
          repository="${IMAGE#ghcr.io/}"
          public=false

          for delay in 0 5 5 5 5; do
            sleep "$delay"
            token="$(
              curl --fail --silent \
                "https://ghcr.io/token?scope=repository:${repository}:pull" |
                jq -r .token
            )"

            if curl --fail --silent \
              --header "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${repository}/tags/list" >/dev/null; then
              public=true
              break
            fi
          done

          if [[ "$public" != true ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY#*/}"
            if [[ "${{ github.event.repository.owner.type }}" == "Organization" ]]; then
              settings_url="https://github.com/orgs/${owner}/packages/container/${name}/settings"
            else
              settings_url="https://github.com/users/${owner}/packages/container/${name}/settings"
            fi
            echo "::error::The image was published but is not public. Change its visibility once at ${settings_url}, then rerun this workflow."
            {
              echo "## Package visibility"
              echo
              echo "The image was published but anonymous pulls are blocked."
              echo "GitHub has no API for changing GHCR visibility."
              echo "Make the package public once at ${settings_url}, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
